<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="יומן אימון">
<meta name="theme-color" content="#15161a">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן אימון">
<meta name="format-detection" content="telephone=no">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15161a">
<title>יומן אימון</title>
<style>
  :root{
    --bg:#15161a; --surface:#1e2027; --surface2:#23262e; --border:#2e323c;
    --txt:#f2f3f5; --muted:#9aa0ab; --faint:#6b7280;
    --amber:#ffb02e; --amber-dim:#4a3a15; --done:#34d399; --stop:#f4634e; --cyan:#4fc3d9;
    --r:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.4;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-user-select:none; user-select:none;}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
  input{font-family:inherit}
  #app{max-width:560px; margin:0 auto; padding:14px 14px 170px}

  .top{display:flex; align-items:center; gap:10px; margin:6px 2px 18px}
  .top .back{width:40px;height:40px;border-radius:12px;background:var(--surface);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--txt);flex:0 0 auto;cursor:pointer}
  .top h1{font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0}
  .top .sub{color:var(--muted); font-size:13px; font-weight:500}

  .section-label{font-size:13px;color:var(--muted);font-weight:600;margin:22px 4px 10px}

  .envgrid{display:flex; flex-direction:column; gap:12px}
  .envcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    padding:18px; display:flex; align-items:center; gap:16px; cursor:pointer;
    transition:transform .08s, border-color .15s}
  .envcard:active{transform:scale(.985); border-color:var(--amber)}
  .envcard .ico{font-size:28px;width:50px;height:50px;border-radius:14px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .envcard .t{font-size:18px;font-weight:700}
  .envcard .d{font-size:13px;color:var(--muted);margin-top:2px}
  .envcard .chev{margin-inline-start:auto;color:var(--faint);font-size:22px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;
    cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .08s,border-color .15s}
  .tile:active{transform:scale(.98);border-color:var(--amber)}
  .tile .ti{font-size:22px}.tile .tn{font-size:14.5px;font-weight:650}

  .day{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    padding:16px; margin-bottom:10px; cursor:pointer; display:flex; align-items:center; gap:12px;
    transition:transform .08s, border-color .15s}
  .day:active{transform:scale(.99); border-color:var(--amber)}
  .day .bar{width:4px; align-self:stretch; border-radius:3px; background:var(--amber); flex:0 0 auto}
  .day .info{flex:1; min-width:0}
  .day .name{font-size:17px; font-weight:700}
  .day .meta{font-size:12.5px; color:var(--muted); margin-top:3px}
  .day .chev{color:var(--faint); font-size:20px}

  .ex{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    margin-bottom:10px; overflow:hidden}
  .ex.ss{border-inline-start:3px solid var(--cyan)}
  .ex.done-ex{border-color:var(--amber-dim)}
  .ex-head{padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer}
  .ex-head .name{font-size:16.5px; font-weight:700}
  .ex-head .prog{font-size:12px; color:var(--faint); margin-top:2px}
  .ex-head .expand{color:var(--faint); font-size:18px; transition:transform .2s; margin-inline-start:auto}
  .ex.open .ex-head .expand{transform:rotate(180deg)}
  .ss-badge{display:inline-block;font-size:10.5px;color:var(--cyan);border:1px solid var(--cyan);
    border-radius:6px;padding:1px 5px;margin-inline-start:6px;vertical-align:middle}
  .ex-body{display:none; padding:0 12px 12px}
  .ex.open .ex-body{display:block}

  .setrow{display:flex; align-items:flex-end; gap:8px; padding:7px 4px; border-top:1px solid var(--border)}
  .setrow .sn{width:24px; text-align:center; color:var(--muted); font-weight:700; font-size:14px; flex:0 0 auto; padding-bottom:12px}
  .setrow .fld{flex:1; min-width:0}
  .setrow .fld .lab{font-size:10.5px; color:var(--faint); text-align:center; margin-bottom:3px}
  .setrow input{background:var(--surface2); border:1px solid var(--border); color:var(--txt);
    border-radius:10px; padding:10px 4px; font-size:16px; text-align:center; width:100%;
    font-variant-numeric:tabular-nums}
  .setrow input:focus{outline:none; border-color:var(--amber)}
  .setrow .tick{width:42px;height:42px;border-radius:12px;flex:0 0 auto;border:1px solid var(--border);
    background:var(--surface2); color:var(--faint); font-size:20px; display:flex;align-items:center;
    justify-content:center; cursor:pointer}
  .setrow.done .tick{background:var(--done); color:#08130d; border-color:var(--done)}
  .setrow.done input{opacity:.55}
  .exadd{margin-top:8px; display:flex; gap:8px}
  .exadd button{flex:1; background:var(--surface2); border:1px dashed var(--border); color:var(--muted);
    border-radius:10px; padding:9px; font-size:13px; cursor:pointer; font-family:inherit}
  .exadd button:active{border-color:var(--amber); color:var(--txt)}

  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;
    font-weight:700;cursor:pointer;font-family:inherit; margin-top:12px}
  .btn.primary{background:var(--amber); color:#1a1205}
  .btn.ghost{background:var(--surface); color:var(--txt); border:1px solid var(--border)}
  .btn.stop{background:transparent;color:var(--stop);border:1px solid var(--border)}
  .btn:active{transform:scale(.99)}

  .empty{text-align:center; color:var(--muted); padding:36px 20px}
  .empty .big{font-size:40px; margin-bottom:12px}
  .empty p{margin:6px 0}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
  .card h4{margin:0 0 4px;font-size:16px}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--border)}
  .kv:first-of-type{border-top:none}
  .kv .k{color:var(--muted);font-size:14px}
  .kv .v{font-weight:700;font-variant-numeric:tabular-nums}
  .kv .delta{font-size:12px;margin-inline-start:8px}
  .up{color:var(--done)}.down{color:var(--stop)}
  .hint{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.55}

  select{background:var(--surface2);border:1px solid var(--border);color:var(--txt);border-radius:10px;
    padding:12px;font-size:15px;width:100%;font-family:inherit}

  /* timer */
  #timerbar{position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:linear-gradient(to top,var(--surface) 72%, transparent);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;}
  .timer{background:var(--surface2); border:1px solid var(--border); border-radius:18px; padding:10px 12px;}
  .timer.run{border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-dim)}
  .timer .rowt{display:flex;align-items:center;gap:10px}
  .timer .disp{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; min-width:70px;
    text-align:center; color:var(--amber); letter-spacing:.5px}
  .timer .disp.idle{color:var(--faint)}
  .presets{display:flex; gap:5px; flex:1}
  .presets button{flex:1; background:var(--surface); border:1px solid var(--border); color:var(--txt);
    border-radius:10px; padding:9px 2px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
    font-variant-numeric:tabular-nums}
  .presets button.sel{border-color:var(--amber);color:var(--amber)}
  .timer .ctl{width:44px;height:44px;border-radius:12px;flex:0 0 auto;border:none;cursor:pointer;
    font-size:19px;display:flex;align-items:center;justify-content:center;background:var(--amber);color:#1a1205}
  .timer .ctl.stop{background:var(--stop);color:#fff}
  .customrow{display:flex;gap:6px;margin-top:8px;align-items:center}
  .customrow input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--txt);
    border-radius:10px;padding:9px;font-size:14px;text-align:center}
  .customrow button{background:var(--surface);border:1px solid var(--border);color:var(--txt);border-radius:10px;
    padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}

  #toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:60;
    background:var(--surface2);border:1px solid var(--amber);color:var(--txt);
    padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;
    transition:opacity .25s, top .25s;pointer-events:none;max-width:90%;text-align:center}
  #toast.show{opacity:1;top:34px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;
    align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-bg.show{opacity:1;pointer-events:auto}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;
    width:100%;max-width:560px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(30px);transition:transform .2s;max-height:88vh;overflow:auto}
  .modal-bg.show .modal{transform:translateY(0)}
  .modal h3{margin:0 0 14px;font-size:18px;font-weight:800}
  .modal label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px}
  .modal input,.modal textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--txt);
    border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
  .modal input:focus,.modal textarea:focus{outline:none;border-color:var(--amber)}
  .modal .row2{display:flex;gap:10px}.modal .row2>div{flex:1}
  .mlabel{display:flex;align-items:center;gap:8px;margin:12px 0 5px}
  .mlabel span{font-size:12.5px;color:var(--muted)}
  .info-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);
    color:var(--cyan);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;font-family:inherit}
  .mguide{display:none;background:var(--surface2);border:1px solid var(--border);border-inline-start:3px solid var(--cyan);
    border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.55;margin:4px 0 2px}
  .mguide.show{display:block}
  svg{display:block;width:100%;height:auto}
</style>
</head>

/* helpers */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtD(d){const p=String(d).split('-');return p.length===3?`${+p[2]}.${+p[1]}`:d}
function num(v){const m=String(v).match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null}
function lastSession(env,dayId){for(let i=SESSIONS.length-1;i>=0;i--)if(SESSIONS[i].env===env&&SESSIONS[i].dayId===dayId)return SESSIONS[i];return null}

function startSession(env,dayId){
  const day=ROUTINES[env].days.find(d=>d.id===dayId);
  const prev=lastSession(env,dayId);
  ACTIVE={id:'s'+Date.now(),env,dayId,dayName:day.name,date:Date.now(),
    exercises:day.ex.map(ex=>{
      const pex=prev&&prev.exercises.find(e=>e.name===ex.name);
      const n=ex.sets||3;const sets=[];
      for(let i=0;i<n;i++){const ps=pex&&pex.sets[i];
        sets.push({weight:ps?ps.weight:(ex.last||''),reps:'',rir:'',done:false,targetReps:ex.reps});}
      return{name:ex.name,target:`${ex.sets||'-'}×${ex.reps}`,sets,ss:!!ex.ss,open:false};
    })};
  if(ACTIVE.exercises[0])ACTIVE.exercises[0].open=true;
  saveA(); go({screen:'session'});
}

function renderSession(app){
  const s=ACTIVE;
  const tot=s.exercises.reduce((a,e)=>a+e.sets.length,0),dn=s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
  app.innerHTML=`
    <div class="top"><div class="back" onclick="go({screen:'days',env:'${s.env}'})">›</div>
      <div><h1>${esc(s.dayName)}</h1><div class="sub num">${dn}/${tot} סטים הושלמו</div></div></div>
    ${s.exercises.map((ex,ei)=>{const exDone=ex.sets.length&&ex.sets.every(x=>x.done);
      const linked=ex.ss||(ei>0&&s.exercises[ei-1].ss);
      return `<div class="ex ${ex.open?'open':''} ${exDone?'done-ex':''} ${linked?'ss':''}">
        <div class="ex-head" onclick="toggleEx(${ei})">
          <div style="flex:1"><div class="name">${esc(ex.name)} ${exDone?'✓':''}${linked?'<span class="ss-badge">סופרסט</span>':''}</div>
          <div class="prog num">יעד ${esc(ex.target)} חזרות</div></div>
          <div class="expand">⌄</div></div>
        <div class="ex-body">
          ${ex.sets.map((st,si)=>`<div class="setrow ${st.done?'done':''}">
            <div class="sn num">${si+1}</div>
            <div class="fld"><div class="lab">משקל</div><input class="num" inputmode="decimal" value="${esc(st.weight)}" onchange="setF(${ei},${si},'weight',this.value)"></div>
            <div class="fld"><div class="lab">חזרות</div><input class="num" inputmode="numeric" value="${esc(st.reps)}" placeholder="${esc(st.targetReps)}" onchange="setF(${ei},${si},'reps',this.value)"></div>
            <div class="fld"><div class="lab">RIR</div><input class="num" inputmode="numeric" value="${esc(st.rir)}" placeholder="–" onchange="setF(${ei},${si},'rir',this.value)"></div>
            <div class="tick" onclick="toggleSet(${ei},${si})">✓</div></div>`).join('')}
          <div class="exadd">
            <button onclick="addSet(${ei})">＋ סט</button>
            <button onclick="rmSet(${ei})">− סט</button>
            <button onclick="toggleSS(${ei})">${ex.ss?'✕ בטל סופרסט':'🔗 סופרסט'}</button>
          </div></div></div>`;}).join('')}
    ${s.exercises.length===0?'<div class="empty"><p>אין תרגילים ביום הזה עדיין.</p></div>':''}
    <button class="btn ghost" onclick="addExercise()">＋ הוסף תרגיל</button>
    <button class="btn primary" onclick="finishSession()">סיים ושמור אימון</button>
    <button class="btn stop" onclick="discardSession()">בטל אימון</button>`;
  renderTimer();
}
function toggleEx(i){const was=ACTIVE.exercises[i].open;ACTIVE.exercises.forEach((e,k)=>e.open=(k===i&&!was));saveA();render()}
function setF(ei,si,f,v){ACTIVE.exercises[ei].sets[si][f]=v;saveA()}
function toggleSet(ei,si){const ex=ACTIVE.exercises[ei],st=ex.sets[si];st.done=!st.done;
  if(st.done){
    startTimer(currentRest);if(navigator.vibrate)navigator.vibrate(15);
    if(ex.sets.every(x=>x.done)){                 // exercise complete → advance to next
      ex.open=false;
      let nxt=-1;
      for(let j=ei+1;j<ACTIVE.exercises.length;j++){if(!ACTIVE.exercises[j].sets.every(x=>x.done)){nxt=j;break;}}
      if(nxt<0)for(let j=0;j<ei;j++){if(!ACTIVE.exercises[j].sets.every(x=>x.done)){nxt=j;break;}}
      if(nxt>=0)ACTIVE.exercises.forEach((e,k)=>e.open=(k===nxt));
    }
  }
  saveA();render();}
function addSet(ei){const ex=ACTIVE.exercises[ei],l=ex.sets[ex.sets.length-1]||{};
  ex.sets.push({weight:l.weight||'',reps:'',rir:'',done:false,targetReps:l.targetReps||''});saveA();render()}
function rmSet(ei){const ex=ACTIVE.exercises[ei];if(ex.sets.length>1){ex.sets.pop();saveA();render()}}
function toggleSS(ei){ACTIVE.exercises[ei].ss=!ACTIVE.exercises[ei].ss;
  const rx=ROUTINES[ACTIVE.env].days.find(d=>d.id===ACTIVE.dayId).ex.find(x=>x.name===ACTIVE.exercises[ei].name);
  if(rx)rx.ss=ACTIVE.exercises[ei].ss;saveR();saveA();render()}

function finishSession(){
  ACTIVE.exercises.forEach(e=>e.sets=e.sets.filter(s=>s.done||s.reps));
  ACTIVE.exercises=ACTIVE.exercises.filter(e=>e.sets.length>0);
  if(ACTIVE.exercises.length===0){toast('לא תועדו סטים');return;}
  ACTIVE.date=Date.now();SESSIONS.push(ACTIVE);saveS();
  const d=today();
  ACTIVE.exercises.forEach(e=>{const w=e.sets[e.sets.length-1].weight;
    if(w){(EXHIST[e.name]=EXHIST[e.name]||[]).push({date:d,weight:String(w)});}});
  saveEH();
  const day=ROUTINES[ACTIVE.env].days.find(d=>d.id===ACTIVE.dayId);
  if(day)ACTIVE.exercises.forEach(e=>{const rx=day.ex.find(x=>x.name===e.name);
    const w=e.sets[e.sets.length-1].weight;if(rx&&w)rx.last=w;});
  saveR();ACTIVE=null;saveA();toast('האימון נשמר 💪');go({screen:'home'});
}
function discardSession(){if(confirm('לבטל את האימון בלי לשמור?')){ACTIVE=null;saveA();go({screen:'days',env:view.env})}}

function addDay(env){openModal('הוסף יום אימון',`<label>שם היום</label><input id="m_name" placeholder="למשל: חזה + כתפיים">`,()=>{

  <div class="row2"><div><label>סטים</label><input id="m_sets" class="num" inputmode="numeric" value="4"></div>

  const st=parseInt(document.getElementById('m_sets').value)||3,rp=document.getElementById('m_reps').value.trim()||'8';

  const day=ROUTINES[ACTIVE.env].days.find(d=>d.id===ACTIVE.dayId);
  if(day&&!day.ex.find(x=>x.name===n))day.ex.push({name:n,sets:st,reps:rp,last:''});saveR();render();return true;});}

function renderProgress(app){

    <div class="top"><div class="back" onclick="go({screen:'home'})">›</div><div><h1>התקדמות</h1>

      ${names.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <div style="margin-top:14px">${chartFor(sel)}</div>`:
      `<div class="empty"><div class="big">📈</div><p>אין עדיין נתוני התקדמות.</p></div>`}`;
  renderTimer();
}
function chartFor(name){
  const pts=(EXHIST[name]||[]).map(p=>({d:p.date,v:num(p.weight)})).filter(p=>p.v!=null);
  if(pts.length<2)return `<div class="hint">צריך לפחות שתי נקודות מדידה כדי לצייר גרף. יש ${pts.length}.</div>`;
  const W=520,H=220,pad=34;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rng=(mx-mn)||1;
  const x=i=>pad+i*(W-2*pad)/(pts.length-1), y=v=>H-pad-(v-mn)/rng*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--amber)"/>`).join('');
  const first=pts[0].v,last=pts[pts.length-1].v,ch=(last-first).toFixed(1),up=last>=first;
  return `<div class="card"><div class="kv"><span class="k">טווח</span>
      <span class="v num">${mn}–${mx} ק"ג</span></div>
    <div class="kv"><span class="k">שינוי מתחילת המעקב</span>
      <span class="v num ${up?'up':'down'}">${up?'+':''}${ch} ק"ג</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="margin-top:8px">
      <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--border)"/>
      <text x="${W-pad}" y="${y(mx)-4}" fill="var(--faint)" font-size="11" text-anchor="end">${mx}</text>
      <text x="${W-pad}" y="${y(mn)+12}" fill="var(--faint)" font-size="11" text-anchor="end">${mn}</text>
      <path d="${line}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}
      <text x="${pad}" y="${H-10}" fill="var(--faint)" font-size="10">${fmtD(pts[0].d)}</text>
      <text x="${W-pad}" y="${H-10}" fill="var(--faint)" font-size="10" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text>
    </svg></div>`;
}

      <div class="sub">${sorted.length} מדידות</div></div></div>
    <div class="hint">כמה למדוד מתי: <b>משקל</b> — יומי, מסתכלים על ממוצע שבועי. <b>היקפים</b> — כל 2–4 שבועות (חודשי מספיק). <b>תמונות</b> — כל 4 שבועות. מדידה יומית של היקפים רק מראה רעש.</div>
    ${last?`<div class="card"><h4>מדידה אחרונה · ${fmtD(last.date)}</h4>
      ${MEAS_FIELDS.filter(f=>last.m[f]!=null).map(f=>{
        const d=prev&&prev.m[f]!=null?(last.m[f]-prev.m[f]):null;
        const ds=d!=null&&d!==0?`<span class="delta ${d>0?'up':'down'}">${d>0?'+':''}${d.toFixed(1)}</span>`:'';
        return `<div class="kv"><span class="k">${esc(f)}</span><span class="v num">${last.m[f]}${ds}</span></div>`;}).join('')}
      </div>`:''}
    <button class="btn primary" onclick="addMeas()">＋ הוסף מדידה חדשה</button>`;
  renderTimer();
}
function waistSVG(){return `<svg viewBox="0 0 200 120" style="max-width:200px;margin:6px auto 0">

function addCardio(){openModal('אימון אירובי',`<label>סוג</label><input id="c_type" value="הליכה/ריצה" >

function allData(){return{routines:ROUTINES,sessions:SESSIONS,exhist:EXHIST,meas:MEAS,cardio:CARDIO,nutrition:NUTRITION,v:3}}
function download(name,text,type){const b=new Blob([text],{type:type||'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);}
function doBackup(){download(`gym-backup-${today()}.json`,JSON.stringify(allData()));toast('גיבוי הורד');}

/* ---- MERGE (never overwrites; keeps differing values) ---- */
function keyOf(o){return o.ts!=null?('ts'+o.ts):JSON.stringify(o);}
function mergeArrById(cur,inc,idFn){const seen=new Set(cur.map(idFn));let added=0,skipped=0;
  inc.forEach(x=>{const k=idFn(x);if(seen.has(k))skipped++;else{cur.push(x);seen.add(k);added++;}});return{added,skipped};}
function mergeRoutines(inc){for(const env in inc){if(!ROUTINES[env]){ROUTINES[env]=inc[env];continue;}
  const byId={};ROUTINES[env].days.forEach(d=>byId[d.id]=d);
  inc[env].days.forEach(d=>{if(!byId[d.id])ROUTINES[env].days.push(d);
    else{const names=new Set(byId[d.id].ex.map(e=>e.name));d.ex.forEach(e=>{if(!names.has(e.name))byId[d.id].ex.push(e);});}});}
  saveR();}
function mergeData(d){
  const r={sessions:0,exhist:0,meas:0,cardio:0,nutrition:0,skipped:0};
  if(d.routines)mergeRoutines(d.routines);
  if(Array.isArray(d.sessions)){const m=mergeArrById(SESSIONS,d.sessions,s=>s.id);r.sessions=m.added;r.skipped+=m.skipped;
    SESSIONS.sort((a,b)=>a.date-b.date);saveS();}
  if(d.exhist){for(const[ex,arr]of Object.entries(d.exhist)){const cur=EXHIST[ex]=EXHIST[ex]||[];
      const seen=new Set(cur.map(p=>p.date+'|'+p.weight));
      arr.forEach(p=>{const k=p.date+'|'+p.weight;if(seen.has(k))r.skipped++;else{cur.push(p);seen.add(k);r.exhist++;}});}
    for(const ex in EXHIST)EXHIST[ex].sort((a,b)=>a.date<b.date?-1:1);saveEH();}
  if(Array.isArray(d.meas)){const byDate={};MEAS.forEach(x=>byDate[x.date]=x);
    d.meas.forEach(x=>{if(byDate[x.date]){const t=byDate[x.date];let ch=false;
        for(const f in x.m){if(t.m[f]==null){t.m[f]=x.m[f];ch=true;}}ch?r.meas++:r.skipped++;}
      else{MEAS.push(x);byDate[x.date]=x;r.meas++;}});
    MEAS.sort((a,b)=>a.date<b.date?-1:1);saveM();}
  if(Array.isArray(d.cardio)){const m=mergeArrById(CARDIO,d.cardio,keyOf);r.cardio=m.added;r.skipped+=m.skipped;saveC();}
  if(Array.isArray(d.nutrition)){const m=mergeArrById(NUTRITION,d.nutrition,keyOf);r.nutrition=m.added;r.skipped+=m.skipped;saveN();}
  return r;
}
function summarize(r){toast(`נוספו ${r.sessions} אימונים · ${r.exhist} רשומות התקדמות · ${r.meas} מדידות · ${r.cardio+r.nutrition} תזונה/אירובי · דילגתי על ${r.skipped} כפילויות`);}
function applyMerge(d){const r=mergeData(d);summarize(r);go({screen:'home'});}
function restoreFromFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{applyMerge(JSON.parse(rd.result));}catch(err){toast('קובץ לא תקין');}};rd.readAsText(f);};
  inp.click();}
function doRestore(){openModal('שחזור מהדבקה (מיזוג)',`<label>הדבק כאן את תוכן קובץ הגיבוי</label>
  <textarea id="r_data" rows="6" placeholder='{"routines":...}'></textarea>`,()=>{
  try{applyMerge(JSON.parse(document.getElementById('r_data').value));return true;}
  catch(e){toast('קובץ לא תקין');return false;}});}
function exportClaude(){
  if(SESSIONS.length===0&&MEAS.length<=3){toast('אין מספיק נתונים חדשים');return;}
  let out='סיכום מ‑יומן אימון:\n\n';
  [...SESSIONS].reverse().slice(0,15).forEach(s=>{out+=`■ ${new Date(s.date).toISOString().slice(0,10)} — ${s.dayName}\n`;
    s.exercises.forEach(e=>{const sets=e.sets.map(x=>`${x.weight||'-'}×${x.reps||'-'}${x.rir!==''&&x.rir!=null?` (RIR ${x.rir})`:''}`).join(', ');
      out+=`   • ${e.name}${e.ss?' [סופרסט]':''}: ${sets}\n`;});out+='\n';});
  if(MEAS.length){const l=[...MEAS].sort((a,b)=>a.date<b.date?-1:1).pop();
    out+=`מדידה אחרונה (${l.date}): `+MEAS_FIELDS.filter(f=>l.m[f]!=null).map(f=>`${f} ${l.m[f]}`).join(', ')+'\n\n';}
  out+='נתח בבקשה: נפח שבועי אפקטיבי לכל קבוצת שריר, פרוגרסיה, ומה כדאי לשנות.';
  copyText(out);
}
function exportCSV(){
  let csv='';
  ['chest','back','legsh','abs','legs'].forEach(did=>{
    const day=ROUTINES.home.days.find(d=>d.id===did);if(!day)return;
    csv+=day.name+'\n'+'תאריך,'+day.ex.map(e=>e.name).join(',')+'\n';
    const rows={};
    day.ex.forEach(e=>(EXHIST[e.name]||[]).forEach(p=>{(rows[p.date]=rows[p.date]||{})[e.name]=p.weight;}));
    Object.keys(rows).sort().forEach(dt=>{csv+=dt+','+day.ex.map(e=>rows[dt][e.name]||'').join(',')+'\n';});
    csv+='\n';
  });
  download(`gym-history-${today()}.csv`,'\ufeff'+csv,'text/csv');toast('CSV הורד');
}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>toast('הועתק! הדבק כאן ב‑Claude')).catch(()=>fb(t));else fb(t);
  function fb(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('הועתק! הדבק כאן ב‑Claude');}catch(e){toast('העתק ידנית');}document.body.removeChild(ta);}}

/* ---- timer (timestamp-based · wake-lock · background-safe) ---- */
let currentRest=90,timerEnd=0,timerInt=null,timerRunning=false,wakeLock=null,notified=false;
const PRESETS=[45,60,90,120,180];
function remaining(){return Math.max(0,Math.round((timerEnd-Date.now())/1000));}
function renderTimer(){
  const bar=document.getElementById('timerbar');
  const left=timerRunning?remaining():currentRest;
  const disp=timerRunning?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:(currentRest+'ש׳');
  bar.innerHTML=`<div class="timer ${timerRunning?'run':''}">
    <div class="rowt">
      <div class="disp ${timerRunning?'':'idle'} num">${disp}</div>
      ${timerRunning?'':`<div class="presets">${PRESETS.map(p=>`<button class="${p===currentRest?'sel':''}" onclick="setRest(${p})">${p}</button>`).join('')}</div>`}
      ${timerRunning?`<button class="ctl stop" onclick="stopTimer()">■</button>`:`<button class="ctl" onclick="startTimer(currentRest)">▶</button>`}
    </div>
    ${timerRunning?'':`<div class="customrow">
      <input id="ct" class="num" inputmode="numeric" placeholder="זמן חופשי (שניות)">
      <button onclick="customRest()">קבע</button>
      <button onclick="startTimer(currentRest)">התחל</button></div>`}
  </div>`;
}
function setRest(s){currentRest=s;renderTimer();}
function customRest(){const v=parseInt(document.getElementById('ct').value);if(v>0){currentRest=v;renderTimer();toast(v+' שניות מנוחה');}}
async function requestWake(){try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');
  wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
function startTimer(sec){
  stopTimer(true);
  timerEnd=Date.now()+sec*1000;timerRunning=true;notified=false;
  if('Notification'in window && Notification.permission==='default'){try{Notification.requestPermission();}catch(e){}}
  requestWake();
  renderTimer();
  timerInt=setInterval(tick,250);
}
function tick(){if(!timerRunning)return;if(remaining()<=0){timerDone();}else renderTimer();}
function stopTimer(silent){clearInterval(timerInt);timerInt=null;timerRunning=false;releaseWake();if(!silent)renderTimer();}
function timerDone(){
  if(notified)return;notified=true;
  clearInterval(timerInt);timerInt=null;timerRunning=false;releaseWake();
  beep();if(navigator.vibrate)navigator.vibrate([120,60,120]);
  notify('זמן מנוחה נגמר 💪','קדימה לסט הבא');
  toast('זמן מנוחה נגמר — קדימה');renderTimer();
}
function notify(title,body){try{
  if('Notification'in window && Notification.permission==='granted'){
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,tag:'rest',renotify:true,vibrate:[120,60,120]})).catch(()=>{try{new Notification(title,{body});}catch(e){}});
    }else{new Notification(title,{body});}
  }
}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!timerRunning)return;
  if(remaining()<=0)timerDone(); else{if(!wakeLock)requestWake();renderTimer();}
});
function beep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=880;
  g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);o.start();o.stop(ac.currentTime+.5);}catch(e){}}

/* ---- modal ---- */
let modalConfirm=null;
function openModal(t,body,ok){document.getElementById('modal').innerHTML=`<h3>${esc(t)}</h3>${body}
  <button class="btn primary" onclick="modalOk()">אישור</button><button class="btn ghost" onclick="closeModal()">ביטול</button>`;
  modalConfirm=ok;document.getElementById('modalbg').classList.add('show');}
function modalOk(){if(modalConfirm&&modalConfirm()!==false)closeModal();}
function closeModal(){document.getElementById('modalbg').classList.remove('show');modalConfirm=null;}
document.getElementById('modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal();});

if(ACTIVE)view={screen:'session'};
render();
</script>
